# Local dev sidecars for the pinpoint app.
#
# The database is NOT here: local dev uses the fc-dev embedded Postgres
# (port 15432, postgres/postgres), which ships PostGIS + pg_trgm as of
# PG 18.3 / PostGIS 3.6.4. `pnpm db:init` creates the `pinpoint` database
# schema + extensions there; DATABASE_URL in server/.env points at it.
#
# (Historical note: this file used to run its own Postgres+PostGIS on 5433
# because the embedded fc-dev Postgres didn't bundle PostGIS. It does now,
# so the container was retired. Integration tests still pull
# imresamu/postgis:18-3.6 themselves via testcontainers.)

services:
  # libpostal sidecar — the address normalizer the matching pipeline calls.
  # Same image the Rust pinpoint targets (pelias/libpostal-service); the
  # /parse + /expand endpoints are stable so TS + Rust hashes collide for
  # identical inputs.
  #
  # The image is large (~3GB — includes ~1.7GB of libpostal model data).
  # Healthcheck waits for /parse to respond rather than just for the port,
  # because the service takes ~30s on first start to load model data into
  # memory.
  libpostal:
    image: pelias/libpostal-service:latest
    container_name: pinpoint-libpostal
    restart: unless-stopped
    ports:
      - '4400:4400'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4400/parse?address=test']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
