packages:
  - 'apps/*'
  - 'apps/*/*'
  - 'packages/*'

allowBuilds:
  # testcontainers (used by @pinpoint/server integration tests) brings in
  # cpu-features + ssh2 for Docker-over-SSH; protobufjs is also a
  # transitive dep with build scripts. None of them run at app runtime,
  # only at install time to compile native bindings.
  # @scarf/scarf arrives transitively via @stoplight/spectral-cli. Its install
  # script is analytics that phones home about the install; nothing needs it at
  # build or runtime. Denied explicitly rather than left unresolved, because an
  # undecided build script fails `pnpm install` and therefore every script.
  '@scarf/scarf': false
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  ssh2: true
  # vue-demi (transitive via @nuxt/ui) — postinstall only switches its entry
  # files to the Vue 3 build; no native code, long-established package.
  vue-demi: true

# Centralised dependency versions. Reference with `"effect": "catalog:"` etc.
# Bump here once instead of in every package.
catalog:
  typescript: ^6.0.3
  vite-plus: ^0.1.21
  vitest: ^4.1.6
  effect: 4.0.0-beta.70
  '@types/node': ^24.0.0

# Lets you opt different apps onto different versions during migrations.
# Reference with `"effect": "catalog:legacy"`.
catalogs:
  legacy:
    effect: 4.0.0-beta.66

onlyBuiltDependencies:
  - esbuild
  - '@swc/core'
